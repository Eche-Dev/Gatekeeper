[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper-asgi"
version = "0.3.1"
description = "Middleware ASGI de seguridad para FastAPI/Starlette: rate limiting, cabeceras seguras, detección de patrones de ataque y auditoría en JSON."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: SPDX + licencias incluidas en el wheel y en el sdist
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ángel David Echenique Villanueva", email = "angel98dev26@gmail.com" }]
maintainers = [{ name = "Ángel David Echenique Villanueva", email = "angel98dev26@gmail.com" }]
# Sin cota superior en starlette a propósito: se verificó que los 247 tests
# pasan con 0.37 (el mínimo declarado) y con 1.9 (la actual), así que acotarla
# solo rompería instalaciones legítimas sin motivo de seguridad.
dependencies = ["starlette>=0.37"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
keywords = ["security", "asgi", "fastapi", "starlette", "waf", "rate-limiting", "sqli", "xss"]

[project.urls]
Homepage = "https://github.com/Eche-Dev/Gatekeeper"
Documentation = "https://eche-dev.github.io/Gatekeeper/"
Repository = "https://github.com/Eche-Dev/Gatekeeper"
Changelog = "https://github.com/Eche-Dev/Gatekeeper/blob/main/gatekeeper-v0.3/gatekeeper/CHANGELOG.md"
Issues = "https://github.com/Eche-Dev/Gatekeeper/issues"
Funding = "https://github.com/sponsors/Eche-Dev"

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
redis = ["redis>=5.0"]
# Servidores ASGI alternativos, para las pruebas de integracion con
# servidores reales (tests/test_servidores_asgi.py).
#
# NO estan en el extra `dev` a proposito: daphne arrastra Twisted, y la
# version ESTABLE de Twisted tiene avisos de seguridad cuyos parches solo
# estan en una release candidate. Como el runtime del paquete no depende de
# ellos, no tiene por que arrastrar ese riesgo, y el job de auditoria de CI
# audita el extra `dev` completo.
#
# Para probarlos: pip install -e ".[dev,servers]"
servers = [
  "hypercorn",
  "daphne",
]
dev = [
  "pytest",
  "pytest-cov",
  "httpx",
  "ruff",
  "bandit",
  "mypy",
  "types-PyYAML",
  "build",
  "twine",
  "hypothesis",
  "mkdocs",
  "mkdocs-material",
  "pyyaml>=6",
  "redis>=5.0",
  "fakeredis[lua]>=2.24",
  # FastAPI NO es dependencia del paquete (solo Starlette), pero los ejemplos de
  # la documentacion usan FastAPI y `tests/test_docs_examples.py` los ejecuta.
  # Sin esto, esos ejemplos no se podrian validar en CI.
  "fastapi",
  # uvicorn: es el servidor ASGI de referencia y no arrastra dependencias
  # con CVEs sin corregir. Se prueba siempre en CI.
  "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selección explícita y fija: sin esto el resultado de `ruff check` depende de
# la versión instalada, y cada ruff nuevo puede añadir reglas que rompan CI.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# los scripts de evaluación y benchmark insertan src/ en sys.path
"tools/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.mypy]
# estricto y contra la versión mínima soportada (3.10): si algo no existe en
# 3.10, mypy lo dice aunque lo ejecutes en una versión más nueva
python_version = "3.10"
strict = true
files = ["src/gatekeeper"]
