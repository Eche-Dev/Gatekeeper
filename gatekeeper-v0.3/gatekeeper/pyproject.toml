[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper-asgi"
version = "0.9.1"
description = "Middleware ASGI de seguridad para FastAPI/Starlette: rate limiting, cabeceras seguras, detección de patrones de ataque y auditoría en JSON."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: SPDX + licencias incluidas en el wheel y en el sdist
license = "MIT"
license-files = ["LICENSE"]
# Sin email en los metadatos: PyPI lo muestra en la ficha y el aviso
# de privacidad no lo cubre. El canal de contacto es GitHub
# Security Advisories (ver SECURITY.md).
authors = [{ name = "Ángel David Echenique Villanueva" }]
maintainers = [{ name = "Ángel David Echenique Villanueva" }]
# Sin cota superior en starlette a propósito: se verificó que la suite
# completa pasa con 0.23 (el mínimo declarado) y con la última, así que acotarla
# solo rompería instalaciones legítimas sin motivo de seguridad.
# El mínimo de Starlette es 0.23.0, verificado ejecutando la suite contra
# 0.23, 0.25, 0.26, 0.27, 0.30, 0.33, 0.35, 0.37, 0.38, 0.41, 0.46 y la
# última (1.10). Antes era 0.37, y eso rompía a quien usara FastAPI 0.103.x
# (que exige starlette<0.28): al instalar Gatekeeper, pip subía Starlette y
# FastAPI dejaba de funcionar. El middleware solo usa MutableHeaders,
# JSONResponse y los tipos ASGI, que son estables desde hace años.
#
# Sin cota superior a proposito: acotar Starlette romperia instalaciones
# legitimas, y el middleware no usa ninguna API que haya cambiado.
dependencies = ["starlette>=0.23"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
keywords = ["security", "asgi", "fastapi", "starlette", "waf", "rate-limiting", "sqli", "xss"]

[project.urls]
Homepage = "https://github.com/Eche-Dev/Gatekeeper"
Documentation = "https://eche-dev.github.io/Gatekeeper/"
Repository = "https://github.com/Eche-Dev/Gatekeeper"
Changelog = "https://github.com/Eche-Dev/Gatekeeper/blob/main/gatekeeper-v0.3/gatekeeper/CHANGELOG.md"
Issues = "https://github.com/Eche-Dev/Gatekeeper/issues"
Funding = "https://github.com/sponsors/Eche-Dev"

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
redis = ["redis>=5.0"]
# Servidores ASGI alternativos, para las pruebas de integracion con
# servidores reales (tests/test_servidores_asgi.py).
#
# NO estan en el extra `dev` a proposito: daphne arrastra Twisted, y la
# version ESTABLE de Twisted tiene avisos de seguridad cuyos parches solo
# estan en una release candidate. Como el runtime del paquete no depende de
# ellos, no tiene por que arrastrar ese riesgo, y el job de auditoria de CI
# audita el extra `dev` completo.
#
# Para probarlos: pip install -e ".[dev,servers]"
servers = [
  "hypercorn",
  "daphne",
]
dev = [
  "pytest",
  "pytest-cov",
  "httpx",
  "ruff",
  "bandit",
  "mypy",
  "types-PyYAML",
  "build",
  "twine",
  "hypothesis",
  # `tomllib` es de Python 3.11. En 3.10 hace falta `tomli` para leer el
  # pyproject.toml (lo usan tests/test_release.py y tools/release_check.py).
  # Sin esto, el job de CI en 3.10 muere al importar el test.
  "tomli>=2; python_version < '3.11'",
  "mkdocs",
  "mkdocs-material",
  "pyyaml>=6",
  "redis>=5.0",
  "fakeredis[lua]>=2.24",
  # FastAPI NO es dependencia del paquete (solo Starlette), pero los ejemplos de
  # la documentacion usan FastAPI y `tests/test_docs_examples.py` los ejecuta.
  # Sin esto, esos ejemplos no se podrian validar en CI.
  "fastapi",
  # uvicorn: es el servidor ASGI de referencia y no arrastra dependencias
  # con CVEs sin corregir. Se prueba siempre en CI.
  "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

# El sdist es lo que se descarga de PyPI para instalar "desde el codigo". No
# tiene que llevar el corpus (588 KiB), la web (248 KiB), las demos ni los
# benchmarks: eso vive en GitHub, y el README lo enlaza.
#
# Medido: el sdist paso de 514 KiB (comprimido) a menos de 100. El CI lo
# vigila (job `package`): un sdist que se hincha es un sdist que nadie se
# baja.
[tool.hatch.build.targets.sdist]
include = [
  "src/gatekeeper",
  "examples",
  "README.md",
  "README.en.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]
# Hatchling se trae por su cuenta los README de los subdirectorios aunque no
# esten en la lista: se excluyen explicitamente.
exclude = [
  "corpus",
  "demo",
  "docs",
  "benchmarks",
  "tools",
  "tests",
  ".audit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selección explícita y fija: sin esto el resultado de `ruff check` depende de
# la versión instalada, y cada ruff nuevo puede añadir reglas que rompan CI.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# los scripts de evaluación y benchmark insertan src/ en sys.path
"tools/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.mypy]
# estricto y contra la versión mínima soportada (3.10): si algo no existe en
# 3.10, mypy lo dice aunque lo ejecutes en una versión más nueva
python_version = "3.10"
strict = true
files = ["src/gatekeeper"]
