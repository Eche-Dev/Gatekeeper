name: Docs
# Compueba la documentación en cada push/PR y la publica en GitHub Pages en
# cada push a main (y en tags o manualmente desde la pestaña Actions).
# Requiere: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatekeeper-v0.3/gatekeeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # El token de GitHub no se queda en `.git/config`: este job no hace
          # push, y un token persistido puede acabar en un artefacto.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: gatekeeper-v0.3/gatekeeper/site

  deploy:
    # En los PR solo se construye (para validarlos); en push a main y en
    # despliegue manual, se publica.
    #
    # OJO con los tags: el entorno `github-pages` SOLO permite desplegar desde
    # la rama por defecto. Intentar desplegar desde un tag falla con
    # "Tag ... is not allowed to deploy to github-pages due to environment
    # protection rules", y ese fallo en rojo bloquea el merge de cualquier PR
    # que comparta commit con el tag. Por eso el tag construye y valida la
    # documentacion, pero NO publica: quien publica es `main`.
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
