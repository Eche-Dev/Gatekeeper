name: CI
on:
  push:
  pull_request:
  # La matriz de compatibilidad se mide creando un entorno por combinacion:
  # es lento, asi que va programado y NO bloquea el push. Si una combinacion
  # se rompe, el aviso sale aqui (y en el informe de docs/compatibilidad.md).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
# Principio de mínimo privilegio (CodeQL `actions/missing-workflow-permissions`):
# sin este bloque, los workflows heredan los permisos del repositorio, que en
# repos anteriores a 2023 son read-write. Aquí ningún job escribe en el repo:
# solo lee código, ejecuta la suite y sube artifacts (eso no usa el token).
permissions:
  contents: read
defaults:
  run:
    # El proyecto vive en un subdirectorio (convención del repo: v0.1 / v0.2 / v0.3)
    working-directory: gatekeeper-v0.3/gatekeeper
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 entra porque es una versión soportada por Python, starlette y
        # FastAPI: probarla aquí es más barato que descubrir que se rompió en el
        # release de un usuario.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      # `servers` trae hypercorn y daphne para las pruebas con servidores
      # ASGI reales. NO estan en `dev` porque daphne arrastra Twisted, cuya
      # version estable tiene avisos de seguridad: el job de auditoria audita
      # `dev`, y el runtime del paquete no depende de ninguno de los dos.
      - run: pip install -e ".[dev,servers]"
      - run: ruff check .
      - run: mypy
      - run: bandit -r src -q
      - run: pytest --cov=gatekeeper --cov-fail-under=90
      - name: Tasa de detección y falsos positivos contra el corpus
        run: python tools/evaluate.py --check
      - name: Tasa de detección y falsos positivos (modo cruzado)
        run: python tools/evaluate_cross.py --check
      - name: Corpus retenido - generalizacion fuera del corpus de desarrollo
        run: python tools/evaluate_heldout.py --check
      - name: Corpus retenido del modo cruzado
        run: python tools/evaluate_cross.py --heldout --check
      - name: Procedencia del corpus externo de CRS
        run: python tools/import_crs.py --check
      - name: La documentacion no miente (version, enlaces, anclas, higiene)
        # Linter propio: comprueba que la version que dicen README, docs,
        # SECURITY.md y CHANGELOG es la misma que la de pyproject.toml, que
        # los enlaces internos y sus anclas existen, y que no vuelven a
        # colarse las erratas que ya se colaron una vez. Determinista y sin
        # dependencias: un linter que da falsos positivos acaba ignorandose.
        run: python tools/check_docs.py

  # Rate limiting contra un Redis REAL, no contra fakeredis.
  #
  # `fakeredis` ejecuta el script Lua de verdad, pero SIMULA el servidor: no
  # reproduce el reparto entre procesos, ni los reinicios, ni el comportamiento
  # cuando Redis cae. Este job levanta un Redis de verdad (servicio `redis` de
  # GitHub Actions) y ejecuta `tests/test_redis_real.py`, que comprueba la
  # garantia que la guia de despliegue promete: con Redis, el limite es global
  # entre workers, no por proceso.
  #
  # Es un job aparte (y no una matriz) porque el servicio Redis se levanta una
  # vez por job: multiplicarlo por las 4 versiones de Python no anade
  # cobertura, solo tiempo de runner.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        # La imagen oficial, fijada por version: `redis:latest` puede cambiar
        # de comportamiento entre Push y la siguiente ejecucion del workflow.
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        # El test abre y cierra conexiones; `--save ""` evita que Redis intente
        # volcar a disco (en CI no hace falta y ralentiza).
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: gatekeeper-v0.3/gatekeeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Rate limiting contra Redis real
        env:
          GATEKEEPER_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/test_redis_real.py -v
      - name: Rate limiting entre varios procesos de Python
        env:
          GATEKEEPER_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/test_redis_multiproceso.py -v
      - name: El servicio Redis responde
        env:
          GATEKEEPER_REDIS_URL: redis://127.0.0.1:6379/0
        run: python tools/check_redis.py

  # NO hay job de latencia en CI, y es una decisión con datos, no una pereza.
  # Se intentó un guard de regresión (`benchmarks/latency.py --check`) y se
  # descartó tras medir: en un runner de CPU compartida el ruido de la máquina
  # es MAYOR que la señal. Medido con el mismo código, overhead p50 sobre la
  # línea base: 73µs en local, 220-312µs en un runner (o un portátil al 30% de
  # CPU), y 175µs con 200 firmas nuevas añadidas al código. Una máquina lenta
  # produce un overhead mayor que una regresión de código real: ningún umbral
  # los separa, así que el guard solo podía dar falsos positivos en CI o ser
  # ciego a regresiones moderadas.
  #
  # El benchmark sigue siendo útil como INFORME (publica p50/p95/p99, que la
  # media escondía) y como herramienta local para comparar antes/después de un
  # cambio, pero el veredicto es de quien lo ejecuta, no del pipeline.
  # Si algún día quieres automatizarlo, necesita un runner con CPU fijada y
  # sin otros jobs; en `ubuntu-latest` compartido no es fiable.

  compat:
    # La matriz de compatibilidad no se supone: se PROBA. Este job crea un
    # entorno virtual por cada combinacion de Starlette/FastAPI y comprueba
    # que el middleware se puede anadir, bloquea un ataque, deja pasar lo
    # legitimo y pone las cabeceras de seguridad.
    #
    # Es lento (un `pip install` por combinacion), asi que va en `schedule` y
    # con `continue-on-error`: informa de la situacion sin bloquear el push.
    # La verdad de la matriz esta en `docs/compatibilidad.md`, que se genera
    # con `python tools/compat_matrix.py`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: gatekeeper-v0.3/gatekeeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mide la matriz de compatibilidad (Starlette x FastAPI)
        run: python tools/compat_matrix.py --json | tee compat_matrix.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: matriz-compatibilidad
          path: gatekeeper-v0.3/gatekeeper/compat_matrix.json

  package:
    # El paquete se construye, se valida y se instala en un entorno limpio:
    # así un fallo de empaquetado (falta py.typed, metadata rota) no llega a PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install --only-binary ":all:" "build==1.6.1" "twine==7.0.0"
      - run: python -m build
      - run: twine check dist/*
      - name: El sdist no se hincha
        # El sdist es lo que se baja de PyPI. Si se lleva el corpus, la web o
        # las demos, baja a "descargar un proyecto" en vez de "instalar un
        # WAF". Medido: 514 KiB -> 95 KiB al excluir lo que vive en GitHub.
        run: |
          SIZE=$(stat -c%s dist/*.tar.gz)
          LIMIT=$((100 * 1024))
          echo "sdist: $SIZE bytes (limite: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::El sdist ha crecido por encima de 100 KiB"
            exit 1
          fi
      - name: El sdist tambien instala (es lo que se baja de PyPI)
        run: |
          python -m venv /tmp/gk-sdist
          /tmp/gk-sdist/bin/pip install dist/*.tar.gz
          /tmp/gk-sdist/bin/python -c "import gatekeeper; print(gatekeeper.__version__)"
          /tmp/gk-sdist/bin/gatekeeper --help > /dev/null
      - name: Instala el wheel en un entorno limpio y comprueba que importa
        run: |
          python -m venv /tmp/gk-venv
          /tmp/gk-venv/bin/pip install dist/*.whl
          /tmp/gk-venv/bin/python -c "import gatekeeper; from gatekeeper import Config; print(gatekeeper.__version__)"
      - name: Comprueba que los tipos llegan al consumidor (py.typed)
        run: |
          /tmp/gk-venv/bin/pip install "mypy==2.4.0"
          printf 'from gatekeeper import Config\nconfig: int = Config()\n' > /tmp/consumidor.py
          if /tmp/gk-venv/bin/mypy /tmp/consumidor.py; then
            echo "mypy NO detectó el error esperado: faltan tipos en el wheel"
            exit 1
          fi
          echo "mypy detectó el error esperado: py.typed funciona"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: gatekeeper-v0.3/gatekeeper/dist/

  audit:
    # Vulnerabilidades conocidas en el árbol de dependencias, incluidas las
    # transitivas (starlette arrastra anyio, httpx…). `pip-audit` consulta la
    # base de avisos de PyPI; sin este job, una CVE en una dependencia solo
    # aparecería cuando la reportara alguien.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gatekeeper-v0.3/gatekeeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: gatekeeper-v0.3/gatekeeper/dist
      # Se audita el `pip freeze` del venv SIN el paquete local: hasta la
      # primera publicación, `gatekeeper-asgi` no está en PyPI y `pip-audit
      # --strict` sale con error por eso — que no es una vulnerabilidad, es que
      # el paquete aún no existe. Lo que importa auditar son sus dependencias.
      - name: Audita el runtime (lo que instala un usuario, con sus transitivas)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q dist/*.whl
          /tmp/audit/bin/pip install -q "pip-audit==2.10.1"
          /tmp/audit/bin/pip freeze \
            | grep -v '^-e ' \
            | grep -vi '^gatekeeper-asgi' \
            | grep -vi '^pip-audit' \
            > /tmp/runtime.txt
          echo "Auditando:"; cat /tmp/runtime.txt
          /tmp/audit/bin/pip-audit --strict --progress-spinner off -r /tmp/runtime.txt
      - name: Audita también el entorno de desarrollo
        run: |
          python -m venv /tmp/audit-dev
          /tmp/audit-dev/bin/pip install -q -e ".[dev]"
          /tmp/audit-dev/bin/pip install -q "pip-audit==2.10.1"
          /tmp/audit-dev/bin/pip freeze \
            | grep -v '^-e ' \
            | grep -vi '^gatekeeper-asgi' \
            | grep -vi '^pip-audit' \
            > /tmp/dev.txt
          /tmp/audit-dev/bin/pip-audit --strict --progress-spinner off -r /tmp/dev.txt
      - name: Audita el extra de servidores (informativo, no bloquea)
        # El extra `servers` (hypercorn + daphne) arrastra Twisted, cuya
        # version ESTABLE tiene avisos de seguridad cuyos parches solo estan
        # en una release candidate (26.10.0rc1). Como el runtime del paquete
        # no depende de Twisted, esto no afecta a quien instala Gatekeeper.
        #
        # El paso NO falla a proposito: informa de la situacion sin bloquear
        # el pipeline, y avisa cuando aparezca una version estable con los
        # parches (entonces hay que moverlo al extra `dev` y quitar el
        # `--ignore-vuln`).
        run: |
          python -m venv /tmp/audit-servers
          /tmp/audit-servers/bin/pip install -q -e ".[dev,servers]"
          /tmp/audit-servers/bin/pip install -q "pip-audit==2.10.1"
          /tmp/audit-servers/bin/pip freeze \
            | grep -v '^-e ' \
            | grep -vi '^gatekeeper-asgi' \
            | grep -vi '^pip-audit' \
            > /tmp/servers.txt
          set +e
          /tmp/audit-servers/bin/pip-audit --progress-spinner off \
            --ignore-vuln CVE-2026-106454 \
            --ignore-vuln CVE-2026-115774 \
            --ignore-vuln CVE-2026-115775 \
            --ignore-vuln CVE-2026-115776 \
            --ignore-vuln CVE-2026-115778 \
            --ignore-vuln CVE-2026-115877 \
            -r /tmp/servers.txt
          echo "::warning::El extra 'servers' arrastra Twisted con avisos sin parche estable. No afecta al runtime del paquete."
