name: CI
on: [push, pull_request]
defaults:
  run:
    # El proyecto vive en un subdirectorio (convención del repo: v0.1 / v0.2 / v0.3)
    working-directory: gatekeeper-v0.3/gatekeeper
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: bandit -r src -q
      - run: pytest --cov=gatekeeper --cov-fail-under=90
      - name: Tasa de detección y falsos positivos contra el corpus
        run: python tools/evaluate.py --check
      - name: Procedencia del corpus externo de CRS
        run: python tools/import_crs.py --check

  latency:
    # Guarda de regresión de latencia (B5). NO es un contrato de rendimiento:
    # los runners de CI comparten CPU, así que el presupuesto tiene margen y el
    # veredicto usa el MEJOR p95 de varias rondas (el ruido del sistema solo
    # sube el percentil, nunca lo baja). Lo que busca es que una regresión
    # grande —reglas caras, un path caliente nuevo— no entre sin que nadie lo note.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Informe de latencia (p50/p95/p99)
        run: python benchmarks/latency.py --iterations 600 --rounds 3
      - name: Guard de regresión
        run: python benchmarks/latency.py --check --iterations 600 --rounds 3

  package:
    # El paquete se construye, se valida y se instala en un entorno limpio:
    # así un fallo de empaquetado (falta py.typed, metadata rota) no llega a PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Instala el wheel en un entorno limpio y comprueba que importa
        run: |
          python -m venv /tmp/gk-venv
          /tmp/gk-venv/bin/pip install dist/*.whl
          /tmp/gk-venv/bin/python -c "import gatekeeper; from gatekeeper import Config; print(gatekeeper.__version__)"
      - name: Comprueba que los tipos llegan al consumidor (py.typed)
        run: |
          /tmp/gk-venv/bin/pip install mypy
          printf 'from gatekeeper import Config\nconfig: int = Config()\n' > /tmp/consumidor.py
          if /tmp/gk-venv/bin/mypy /tmp/consumidor.py; then
            echo "mypy NO detectó el error esperado: faltan tipos en el wheel"
            exit 1
          fi
          echo "mypy detectó el error esperado: py.typed funciona"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: gatekeeper-v0.3/gatekeeper/dist/
